name: Build APK and publish a GitHub Release

# Neither the 24 MB APK nor the signing keystore travels in git (both are
# gitignored), so CI can only reproduce the *signed* release build when the
# owner supplies the signing material as repository secrets:
#
#   ANDROID_KEYSTORE_BASE64  - rentbuddy-release.jks base64-encoded (one line)
#   KEYSTORE_STORE_PASSWORD  - keystore password
#   KEYSTORE_KEY_ALIAS       - key alias (as in local keystore.properties)
#   KEYSTORE_KEY_PASSWORD    - key password
#
# With secrets set, the uploaded APK is the same signed artifact that
# `npm run cap:build:release` produces locally. Without them the workflow
# FAILS before publishing (Android refuses to install unsigned APKs, so an
# unsigned release asset would be another dead download) unless the run is
# dispatched with "allow unsigned" for a smoke build - which is then labelled
# loudly in the release notes.
#
# The published asset URL is stable and free of versioning noise:
#   https://github.com/Santhosh33333/2rent--01/releases/download/nabri-v<version>/nabri.apk
# Paste it into Vercel as NABRI_APK_URL (Settings -> Environment Variables on
# the 2rent-01 project) and the landing + /download buttons light up on the
# next web deploy. Full runbook: DEPLOY_APK.md at the repo root.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (tag: nabri-v<version>, asset: nabri.apk)'
        required: true
        default: '1.0.15'
      prerelease:
        description: 'Mark as a prerelease (keeps it off the default "latest")'
        type: boolean
        default: false
      allow_unsigned:
        description: 'Publish even without keystore secrets (produces a NON-INSTALLABLE artifact - smoke tests only)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17 (AGP 8 / Capacitor 8 requirement)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app (produces dist/, which Capacitor packages)
        working-directory: packages/web
        run: npm run build

      - name: Restore signing material from secrets
        id: signing
        working-directory: packages/web/android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > rentbuddy-release.jks
            printf "storeFile=rentbuddy-release.jks\n" > keystore.properties
            printf "storePassword=%s\n" "$KEYSTORE_STORE_PASSWORD" >> keystore.properties
            printf "keyAlias=%s\n" "$KEYSTORE_KEY_ALIAS" >> keystore.properties
            printf "keyPassword=%s\n" "$KEYSTORE_KEY_PASSWORD" >> keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore restored, keystore.properties written."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the release APK will be UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Sync Capacitor and assemble the release APK
        working-directory: packages/web
        run: |
          npx cap sync android
          cd android && ./gradlew assembleRelease

      - name: Verify artifact exists and is signed when secrets were supplied
        working-directory: packages/web/android/app/build/outputs/apk/release
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          ls -la app-release.apk
          sha256sum app-release.apk
          if [ "$SIGNED" = "true" ]; then
            BT=$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)
            "$ANDROID_SDK_ROOT/build-tools/$BT/apksigner" verify --print-certs app-release.apk | head -6
          fi

      - name: Publish GitHub Release with the APK asset
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SRC: packages/web/android/app/build/outputs/apk/release/app-release.apk
          APK_VERSION: ${{ inputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          PRERELEASE: ${{ inputs.prerelease }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          set -euo pipefail
          TAG="nabri-v${APK_VERSION}"
          URL="https://github.com/Santhosh33333/2rent--01/releases/download/${TAG}/nabri.apk"

          # Re-running with the same version replaces the old release instead of
          # erroring on an existing tag.
          gh release delete "${TAG}" --yes --cleanup-tag >/dev/null 2>&1 || true

          if [ "$SIGNED" = "true" ]; then
            SIG_LINE=":white_check_mark: **Signed release build** (keystore secrets applied)."
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            SIG_LINE=":warning: **UNSIGNED artifact** - ANDROID_KEYSTORE_BASE64 was not set on this run. Android will REFUSE to install this file; it exists for smoke/QA capture only."
          else
            echo "::error::Release build is UNSIGNED (ANDROID_KEYSTORE_BASE64 not set). Android refuses to install unsigned APKs, so nothing was published."
            echo "::error::Add the keystore secrets per DEPLOY_APK.md and re-run, or re-run with 'allow unsigned' checked to publish a broken smoke artifact anyway."
            exit 1
          fi

          PRERELEASE_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES=$(printf 'Nabri Android APK v%s\n\n%s\n\nAsset URL:\n%s\n\nSet this URL as `NABRI_APK_URL` on the Vercel `2rent-01` project to enable the landing/download-page buttons (see DEPLOY_APK.md).\n\nInstall is gated on `versionCode` being higher than what users already have - bump `packages/web/android/app/build.gradle` before a real update.' "${APK_VERSION}" "${SIG_LINE}" "${URL}")

          # A stable asset name (nabri.apk) keeps the URL constant across versions.
          cp "${APK_SRC}" /tmp/nabri.apk
          gh release create "${TAG}" /tmp/nabri.apk \
            --title "Nabri v${APK_VERSION}" \
            --notes "${NOTES}" ${PRERELEASE_FLAG}

          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo
          echo "APK published: ${URL}"