name: Keep Render API awake

# Render's free tier spins the API down after ~15 minutes with no traffic, and
# the next request then takes 30-60s to wake it. A GitHub cron of "*/10" does
# NOT actually keep it awake: GitHub heavily delays high-frequency schedules on
# free runners (this workflow was observed running only every 4-6 hours, i.e.
# the API slept most of the day). Instead, one job is scheduled every 5 hours
# and pings every 10 minutes for its whole (up to 6-hour) slot, so there is
# always a ping well inside Render's 15-minute idle window.
on:
  schedule:
    - cron: '0 */5 * * *'
  # Manual run from the Actions tab, useful for testing the pings.
  workflow_dispatch:

permissions: {}

# A newer slot should replace a still-running older one rather than queue behind
# it (two runners pinging the same URL is pointless and wastes minutes).
concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # 35 pings at 10-minute spacing is ~5h50m, just inside the 6-hour cap.
    timeout-minutes: 350
    steps:
      - name: Ping /health and /health/db every 10 minutes
        run: |
          set -u
          API=https://rentbuddy-api-s7rz.onrender.com
          # Consecutive failed DB checks; initialised because `set -u` would
          # otherwise abort `db_down=$((db_down + 1))` on its first evaluation.
          db_down=0
          for i in $(seq 1 35); do
            ts=$(date -u +%H:%M:%S)

            # Liveness route lives at the root (/health), NOT /api/health -
            # everything under /api sits behind auth and answers 401 there.
            health=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$API/health" || true)

            # /health/db answers 200 with {"status":"ok"} only while the database
            # is reachable. The old check grepped for '"status": "ok"' (with a
            # space), but the API emits compact JSON '"status":"ok"', so it
            # matched nothing and failed on EVERY run — a false outage alarm.
            # Compare whitespace-stripped output and the HTTP status instead.
            resp=$(curl -s -w $'\n%{http_code}' --max-time 90 "$API/health/db" || true)
            dbcode=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')

            echo "ping $i/35 $ts — /health=${health} /health/db=${dbcode} ${body}"

            if [ -z "$health" ] || [ "$health" = "000" ]; then
              echo "::warning::/health unreachable on ping $i (cold start or outage)"
            fi

            if [ "$dbcode" = "200" ] && printf '%s' "$body" | tr -d '[:space:]' | grep -q '"status":"ok"'; then
              db_down=0
            else
              db_down=$((db_down + 1))
              echo "::warning::/health/db not ok on ping $i (streak ${db_down}) — ${dbcode} ${body}"
            fi

            # A single blip is not worth failing the run (and emailing the
            # owner) over, but the API answering 200 while the database is
            # unreachable means login/wallet/payments are all 500 — a real
            # outage. Fail fast then: alert the owner and free the runner
            # instead of pinging a broken backend for hours.
            if [ "${db_down:-0}" -ge 3 ]; then
              echo "::error::Database has been unreachable for 3 consecutive pings — aborting keepalive"
              exit 1
            fi

            if [ "$i" -lt 35 ]; then
              sleep 600
            fi
          done
