name: Keep Render API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Nabri API health to prevent Render free-tier sleep
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://rentbuddy-api-s7rz.onrender.com/api/health || true)
          echo "health status: ${code}"
          # 401 is fine (endpoint is auth-guarded); a total failure (000/empty)
          # flags a real outage worth investigating.
          if [ "$code" = "000" ] || [ -z "$code" ]; then
            echo "::error::API unreachable during keepalive ping"
            exit 1
          fi
      - name: Ping DB liveness probe
        run: |
          body=$(curl -s --max-time 60 \
            https://rentbuddy-api-s7rz.onrender.com/api/health/db || true)
          echo "health/db response: ${body}"
          # A 503/5xx from /health/db means the API is up but the database is
          # unreachable (login, wallets, KYC, payments all 500). Surface that as
          # a failing run so the owner gets the GitHub Action failure email.
          if echo "${body}" | grep -q '"status": "ok"'; then
            echo "DB liveness: OK"
          else
            echo "::error::Database unreachable according to /api/health/db"
            echo "body=${body}"
            exit 1
          fi