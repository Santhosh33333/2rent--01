apply plugin: 'com.android.application'

// Release signing. Credentials live in android/keystore.properties (gitignored).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "app.rentbuddy.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.rentbuddy.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 15 / 1.0.14: ships the walking-request create form fix. That form
        // posted field names the API does not read (startLocation/endLocation
        // are non-nullable, startTime went through `new Date(undefined)`), so
        // every submit returned a bare 500 and the feature was unusable. Also
        // the digest financial report and the Verification step-metadata fix.
        //
        // 14 / 1.0.13 was the previous build; 15 / 1.0.14 shipped before this
        // one. Android refuses to install an update whose versionCode is not
        // higher, so this must be bumped on every release users already have.
        //
        // 16 / 1.0.15 bundles the feed-publish fix (null media fields were
        // rejected with 422, so posting text/photo never worked), the /search
        // "Invalid Date" upcoming-events fix, and the profile-photo path.
        //
        // 17 / 1.0.16 fixes in-app call audio (RECORD_AUDIO was undeclared and
        // A/V never reached the relay), push notifications (the opt-in flag was
        // never set, so no device token was registered), and dead proof-image
        // links in the admin console.
        //
        // 19 / 1.0.18: header burger removed (misclicks on web + app), no more
        // full-screen interstitials, the banner strip tracks the real ad
        // height, and LIVE AdMob ids replace Google's test units.
        versionCode 19
        versionName "1.0.18"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
