apply plugin: 'com.android.application'

// Release signing. Credentials live in android/keystore.properties (gitignored).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "app.rentbuddy.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.rentbuddy.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 15 / 1.0.14: ships the walking-request create form fix. That form
        // posted field names the API does not read (startLocation/endLocation
        // are non-nullable, startTime went through `new Date(undefined)`), so
        // every submit returned a bare 500 and the feature was unusable. Also
        // the digest financial report and the Verification step-metadata fix.
        //
        // 14 / 1.0.13 was the previous build; 15 / 1.0.14 shipped before this
        // one. Android refuses to install an update whose versionCode is not
        // higher, so this must be bumped on every release users already have.
        //
        // 16 / 1.0.15 bundles the feed-publish fix (null media fields were
        // rejected with 422, so posting text/photo never worked), the /search
        // "Invalid Date" upcoming-events fix, and the profile-photo path.
        //
        // 17 / 1.0.16 fixes in-app call audio (RECORD_AUDIO was undeclared and
        // A/V never reached the relay), push notifications (the opt-in flag was
        // never set, so no device token was registered), and dead proof-image
        // links in the admin console.
        //
        // 19 / 1.0.18: header burger removed (misclicks on web + app), no more
        // full-screen interstitials, the banner strip tracks the real ad
        // height, and LIVE AdMob ids replace Google's test units.
        //
        // 20 / 1.0.19: the signup wizard no longer fails silently. Every
        // validation and server error now renders inline on the current step
        // and an invalid step refuses to advance. Before this, a duplicate
        // email (or any failed OTP request) re-rendered the Send button with no
        // message, and a rejection on the final step was only a toast.
        // 23 / 1.0.22 unblocks native Google sign-in. The release keystore
        // SHA-1 is registered in the Firebase project, which produced the
        // Android OAuth clients now in google-services.json; the backend
        // accepts the ID-token audience those clients sign.
        //
        // 24 / 1.0.23 ships video calling in chat/bookings (the WebRTC client
        // already carried the video path), FLAG_SECURE so the app cannot be
        // screenshotted or screen-recorded, the returning-user onboarding fix
        // (signed-in users were re-shown the account-type chooser), and the
        // image/upload picker fixes (HEIC-era MIME fallback + upload filters).
        //
        // 25 / 1.0.24 fixes the in-app Google button that opened no account
        // picker: the Firebase Auth plugin defaults to Android Credential
        // Manager, which silently does nothing where it is unavailable, so the
        // app now asks for the classic GoogleSignIn intent instead. Also adds
        // host file uploads to listening/watching rooms.
        //
        // 26 / 1.0.25 bundles everything since that build: the chat thread no
        // longer refreshes on its own (a 15s poll replaced the whole list and
        // yanked the scroll mid-conversation) and the composer grows with the
        // message instead of clipping long text; movie type-ahead; photo
        // crop/remove; the KYC placeholder-phone fix; YouTube-linked and
        // retention-limited music rooms; chat unlocked only by an accepted
        // request; new-post notifications and the official read-only Nabri
        // Community with its 1:1 welcome DM; the full transaction history; the
        // paid-but-still-asked-to-pay subscription fix and its paywall UI; and
        // the Google sign-in avatar preservation.
        versionCode 26
        versionName "1.0.25"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
