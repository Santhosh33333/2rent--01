    <rect x="150" y="188" width="52" height="168" rx="26"/>
    <rect x="310" y="188" width="52" height="168" rx="26"/>
  </g>
  <line x1="176" y1="203" x2="336" y2="343" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>
  <circle cx="362" cy="150" r="34" fill="#D8F53C"/>
  <circle cx="362" cy="150" r="45" fill="none" stroke="#D8F53C" stroke-opacity="0.4" stroke-width="5"/>
  <circle cx="362" cy="150" r="8" fill="#FFFFFF" opacity="0.95"/>
</svg>
