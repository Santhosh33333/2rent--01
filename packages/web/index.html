<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <meta name="theme-color" content="#081F4F" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nabri — your partner for every side of life. CarryBuddy, walking partners, bookings, events and communities, all nearby." />
    <meta property="og:title" content="Nabri — Good things happen nearby." />
    <meta property="og:description" content="One app for every side of life: CarryBuddy, walking partners, bookings, events and communities." />
    <meta property="og:image" content="/logo-mark.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts load without blocking first paint: the stylesheet is fetched with
      media="print" and promoted to "all" once it arrives, so slow connections
      render the app immediately and swap the font in (the URL sets
      font-display:swap). Previously this was a render-blocking <link>, which
      held up the whole app on mobile data.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Nabri — Good things happen nearby.</title>
    <style>
      body { margin: 0; background: #081F4F; }
      #root-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 22%, #0D378B 0%, #081F4F 55%, #051536 100%);
        z-index: 9999; transition: opacity 0.3s;
      }
      #root-loader.hide { opacity: 0; pointer-events: none; }
      .loader-ring { position: absolute; border: 1.5px solid rgba(255,255,255,0.09); border-radius: 50%; }
      .loader-ring.r1 { width: 120px; height: 120px; animation: ringDrift 3.2s ease-in-out infinite; }
      .loader-ring.r2 { width: 180px; height: 180px; animation: ringDrift 3.2s ease-in-out infinite 0.4s; }
      .loader-ring.r3 { width: 240px; height: 240px; animation: ringDrift 3.2s ease-in-out infinite 0.8s; }
      @keyframes ringDrift { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.08); opacity: 0.35; } }
      .loader-mark { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 18px 50px rgba(3,10,32,0.55); position: relative; z-index: 2; }
      .loader-dot { position: absolute; top: calc(50% + 46px); left: calc(50% - 4px); width: 8px; height: 8px; border-radius: 999px; background: #D2F53C; opacity: 0.65; animation: dotRise 2.6s ease-in-out infinite; }
      @keyframes dotRise { 0% { transform: translateY(0); opacity: 0; } 18% { opacity: 0.65; } 82% { opacity: 0.65; } 100% { transform: translateY(-46px); opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!--
      Google Identity Services is intentionally NOT loaded here. It is fetched
      on demand by src/lib/googleAuth.ts, so signed-in users no longer download
      the Google SDK on every page. No payment SDK is loaded: online payments
      are UPI-only (paid to the Nabri UPI ID, verified by an admin).
    -->
  </head>
  <body>
    <div id="root-loader">
      <div class="loader-ring r1"></div>
      <div class="loader-ring r2"></div>
      <div class="loader-ring r3"></div>
      <img class="loader-mark" src="/logo-mark.svg" alt="" />
      <div class="loader-dot"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var loader = document.getElementById('root-loader');
        window.__nabriBooted = false;
        window.addEventListener('load', function () {
          setTimeout(function () {
            var node = document.getElementById('root-loader');
            if (node) { node.classList.add('hide'); setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 300); }
          }, 200);
        });
        // If the bundle never boots (old WebView rejects modern syntax,
        // network blocked, etc.) show a readable message instead of a black screen.
        setTimeout(function () {
          if (!window.__nabriBooted && loader) {
            loader.classList.remove('hide');
            loader.innerHTML = '<div style="max-width:300px;text-align:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#fafafa">' +
              '<img src="/logo-mark.svg" alt="Nabri" style="width:56px;height:56px;margin:0 auto 14px;display:block;opacity:.9" />' +
              '<p style="font-size:15px;font-weight:600;margin:0 0 8px">Nabri could not start</p>' +
              '<p style="font-size:13px;opacity:.85;margin:0 0 14px;line-height:1.4">This device needs a newer Android System WebView to run the app.</p>' +
              '<p style="font-size:12px;opacity:.7;margin:0;line-height:1.5">Open the Play Store, search &quot;Android System WebView&quot;, tap Update, then open Nabri again.</p>' +
              '</div>';
          }
        }, 6000);
      }());
    </script>
  </body>
</html>
