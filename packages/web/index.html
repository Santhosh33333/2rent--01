<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Nabri - Good things happen nearby." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Nabri</title>
    <style>
      body { margin: 0; background: #09090b; }
      #root-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #09090b; z-index: 9999; transition: opacity 0.3s;
      }
      #root-loader.hide { opacity: 0; pointer-events: none; }
      .loader-spinner {
        width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #818cf8; border-radius: 50%; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root-loader"><div class="loader-spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var loader = document.getElementById('root-loader');
        window.__nabriBooted = false;
        window.addEventListener('load', function () {
          setTimeout(function () {
            var node = document.getElementById('root-loader');
            if (node) { node.classList.add('hide'); setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 300); }
          }, 200);
        });
        // If the bundle never boots (old WebView rejects modern syntax,
        // network blocked, etc.) show a readable message instead of a black screen.
        setTimeout(function () {
          if (!window.__nabriBooted && loader) {
            loader.classList.remove('hide');
            loader.innerHTML = '<div style="max-width:300px;text-align:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#fafafa">' +
              '<img src="/logo-mark.svg" alt="Nabri" style="width:56px;height:56px;margin:0 auto 14px;display:block;opacity:.9" />' +
              '<p style="font-size:15px;font-weight:600;margin:0 0 8px">Nabri could not start</p>' +
              '<p style="font-size:13px;opacity:.85;margin:0 0 14px;line-height:1.4">This device needs a newer Android System WebView to run the app.</p>' +
              '<p style="font-size:12px;opacity:.7;margin:0;line-height:1.5">Open the Play Store, search &quot;Android System WebView&quot;, tap Update, then open Nabri again.</p>' +
              '</div>';
          }
        }, 6000);
      }());
    </script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </body>
</html>
