<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#14439F"/>
      <stop offset="42%" stop-color="#0B256A"/>
      <stop offset="100%" stop-color="#050E33"/>
    </linearGradient>
    <radialGradient id="badgeGloss" cx="34%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cynGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39E3FF" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#1FC7F0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0E7FD0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="38%" stop-color="#D2F8FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7FD9FF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>
    <filter id="sharpGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="badgeClip">
      <rect x="214" y="34" width="372" height="372" rx="88"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="200" y="20" width="400" height="400" rx="96" fill="#03081F" opacity="0.35" filter="url(#sharpGlow)"/>
  <rect x="202" y="22" width="396" height="396" rx="94" fill="url(#badge)"/>
  <g clip-path="url(#badgeClip)">
    <rect x="202" y="22" width="396" height="396" fill="url(#badgeGloss)"/>
    <ellipse cx="400" cy="230" rx="165" ry="125" fill="url(#cynGlow)"/>
    <line x1="40" y1="440" x2="760" y2="-260" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="26"/>
  </g>
  <rect x="210" y="30" width="380" height="380" rx="86" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" fill="none"/>

  <!-- Glossy glass N -->
  <g stroke="url(#nGlass)" stroke-width="44" stroke-linecap="round" fill="none" filter="url(#sharpGlow)" opacity="0.35">
    <path d="M330 140V300"/>
    <path d="M470 140V300"/>
    <path d="M330 174L470 252"/>
  </g>
  <g stroke="url(#nGlass)" stroke-width="44" stroke-linecap="round" fill="none">
    <path d="M330 132V310"/>
    <path d="M470 132V310"/>
    <path d="M330 170L470 252"/>
  </g>
  <path d="M312 150V300" stroke="#FFFFFF" stroke-opacity="0.80" stroke-width="7" stroke-linecap="round"/>
  <path d="M452 150V300" stroke="#FFFFFF" stroke-opacity="0.46" stroke-width="5" stroke-linecap="round"/>
  <path d="M336 186L464 244" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <path d="M562 120l9 14 14 9-14 9-9 14-9-14-14-9 14-9Z" fill="#8FF4FF" filter="url(#sharpGlow)"/>

  <!-- Wordmark -->
  <text x="400" y="872" text-anchor="middle" fill="#FFFFFF" opacity="0.45" font-family="'Plus Jakarta Sans','Inter','SF Pro Display',-apple-system,'Segoe UI',system-ui,sans-serif" font-size="136" font-weight="700" letter-spacing="6" filter="url(#sharpGlow)">nabri</text>
  <text x="400" y="872" text-anchor="middle" fill="url(#wordmark)" font-family="'Plus Jakarta Sans','Inter','SF Pro Display',-apple-system,'Segoe UI',system-ui,sans-serif" font-size="136" font-weight="700" letter-spacing="6">nabri</text>
  <path d="M318 920h164" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" filter="url(#sharpGlow)"/>
  <path d="M318 920h164" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <circle cx="500" cy="920" r="8" fill="#39E3FF" filter="url(#sharpGlow)"/>
  <circle cx="500" cy="920" r="8" fill="#7FEFFF"/>
</svg>