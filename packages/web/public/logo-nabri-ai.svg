<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" fill="none">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#14439F"/>
      <stop offset="42%" stop-color="#0B256A"/>
      <stop offset="100%" stop-color="#050E33"/>
    </linearGradient>
    <radialGradient id="badgeGloss" cx="34%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cynGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39E3FF" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#1FC7F0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0E7FD0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="38%" stop-color="#D2F8FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7FD9FF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>
    <filter id="sharpGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ringSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="badgeClip">
      <rect x="214" y="184" width="772" height="772" rx="178"/>
    </clipPath>
  </defs>

  <!-- Flat orange ground (cutout friendly) -->
  <rect x="0" y="0" width="1200" height="1500" fill="#FF6B35"/>

  <!-- Badge -->
  <rect x="200" y="170" width="800" height="800" rx="188" fill="#050E33" opacity="0.28" filter="url(#ringSoft)"/>
  <rect x="206" y="176" width="788" height="788" rx="184" fill="url(#badge)"/>
  <g clip-path="url(#badgeClip)">
    <rect x="206" y="176" width="788" height="788" fill="url(#badgeGloss)"/>
    <ellipse cx="600" cy="565" rx="330" ry="250" fill="url(#cynGlow)"/>
    <!-- diagonal tech light streaks -->
    <line x1="120" y1="980" x2="1080" y2="120" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="46"/>
    <line x1="330" y1="980" x2="940" y2="360" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="24"/>
  </g>
  <!-- inset glass ring -->
  <rect x="222" y="192" width="756" height="756" rx="172" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="5" fill="none"/>

  <!-- Glossy glass N -->
  <g stroke="url(#nGlass)" stroke-width="86" stroke-linecap="round" fill="none" filter="url(#sharpGlow)" opacity="0.35">
    <path d="M455 420V648"/>
    <path d="M745 420V648"/>
    <path d="M455 476L745 612"/>
  </g>
  <g stroke="url(#nGlass)" stroke-width="86" stroke-linecap="round" fill="none">
    <path d="M455 410V662"/>
    <path d="M745 410V662"/>
    <path d="M455 470L745 614"/>
  </g>
  <!-- glass reflections left-top -->
  <path d="M418 420V648" stroke="#FFFFFF" stroke-opacity="0.80" stroke-width="13" stroke-linecap="round"/>
  <path d="M708 420V648" stroke="#FFFFFF" stroke-opacity="0.46" stroke-width="9" stroke-linecap="round"/>
  <path d="M467 484L733 604" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="9" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M860 300l18 28 28 18-28 18-18 28-18-28-28-18 28-18Z" fill="#8FF4FF" filter="url(#sharpGlow)"/>

  <!-- Wordmark -->
  <text x="600" y="1306" text-anchor="middle" fill="#2D2160" opacity="0.5" font-family="'Plus Jakarta Sans','Inter','SF Pro Display',-apple-system,'Segoe UI',system-ui,sans-serif" font-size="150" font-weight="700" letter-spacing="6" filter="url(#sharpGlow)">nabri</text>
  <text x="600" y="1306" text-anchor="middle" fill="url(#wordmark)" font-family="'Plus Jakarta Sans','Inter','SF Pro Display',-apple-system,'Segoe UI',system-ui,sans-serif" font-size="150" font-weight="700" letter-spacing="6">nabri</text>
  <!-- underline accent -->
  <path d="M470 1370h260" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round" filter="url(#sharpGlow)"/>
  <path d="M470 1370h260" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
  <circle cx="754" cy="1370" r="11" fill="#39E3FF" filter="url(#sharpGlow)"/>
  <circle cx="754" cy="1370" r="11" fill="#7FEFFF"/>
</svg>