<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1920" fill="none">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#14439F"/>
      <stop offset="42%" stop-color="#0B256A"/>
      <stop offset="100%" stop-color="#050E33"/>
    </linearGradient>
    <radialGradient id="badgeGloss" cx="34%" cy="12%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cynGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39E3FF" stop-opacity="0.55"/>
      <stop offset="42%" stop-color="#1FC7F0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0E7FD0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="38%" stop-color="#D2F8FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7FD9FF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>
    <filter id="sharpGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Flat navy splash ground -->
  <rect x="0" y="0" width="1280" height="1920" fill="#0B256A"/>
  <radialGradient id="ambient" cx="50%" cy="38%" r="62%">
    <stop offset="0%" stop-color="#14439F" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#0B256A" stop-opacity="0"/>
  </radialGradient>
  <circle cx="640" cy="700" r="620" fill="url(#ambient)"/>

  <!-- Center badge -->
  <g transform="translate(312 452)">
    <rect x="202" y="18" width="308" height="308" rx="74" fill="url(#badge)"/>
    <g>
      <rect x="202" y="18" width="308" height="308" fill="url(#badgeGloss)"/>
      <ellipse cx="356" cy="243" rx="150" ry="115" fill="url(#cynGlow)"/>
      <line x1="120" y1="460" x2="600" y2="-40" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="30"/>
    </g>
    <rect x="210" y="26" width="292" height="292" rx="66" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" fill="none"/>
    <g stroke="url(#nGlass)" stroke-width="36" stroke-linecap="round" fill="none" filter="url(#sharpGlow)" opacity="0.35">
      <path d="M318 136V296"/>
      <path d="M402 136V296"/>
      <path d="M318 166L402 232"/>
    </g>
    <g stroke="url(#nGlass)" stroke-width="36" stroke-linecap="round" fill="none">
      <path d="M318 130V306"/>
      <path d="M402 130V306"/>
      <path d="M318 164L402 232"/>
    </g>
    <path d="M305 146V296" stroke="#FFFFFF" stroke-opacity="0.80" stroke-width="6" stroke-linecap="round"/>
    <path d="M389 146V296" stroke="#FFFFFF" stroke-opacity="0.46" stroke-width="4" stroke-linecap="round"/>
    <path d="M323 178L398 228" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
    <path d="M442 128l7 11 11 7-11 7-7 11-7-11-11-7 11-7Z" fill="#8FF4FF" filter="url(#sharpGlow)"/>
  </g>

  <!-- Wordmark -->
  <text x="640" y="1030" text-anchor="middle" fill="#FFFFFF" opacity="0.45" font-family="'Plus Jakarta Sans','Inter','SF Pro Display',-apple-system,'Segoe UI',system-ui,sans-serif" font-size="110" font-weight="700" letter-spacing="8" filter="url(#sharpGlow)">nabri</text>
  <text x="640" y="1030" text-anchor="middle" fill="url(#wordmark)" font-family="'Plus Jakarta Sans','Inter','SF Pro Display',-apple-system,'Segoe UI',system-ui,sans-serif" font-size="110" font-weight="700" letter-spacing="8">nabri</text>
  <path d="M500 1088h280" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <circle cx="798" cy="1088" r="9" fill="#39E3FF"/>
</svg>