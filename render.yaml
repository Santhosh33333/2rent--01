services:
  - type: web
    name: rentbuddy-api
    runtime: node
    region: oregon
    rootDir: packages/backend
    buildCommand: npm install && npx prisma generate && (npx prisma migrate deploy || echo "migrate deploy: continuing") && npx prisma db push && npm run build
    startCommand: node dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    healthCheckPath: /api/health
    autoDeploy: true
