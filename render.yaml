services:
  - type: web
    name: rentbuddy-api
    runtime: node
    # The database is Neon in us-east-1. The earlier "singapore" region and its
    # rationale were left over from the Supabase days; the cross-Pacific query
    # problem was really Supabase being in ap-southeast-1, not Oregon itself.
    # With Neon on us-east-1, Oregon is the correct choice: /health/db now
    # measures ~57ms steady (it was ~875ms against Supabase in Singapore).
    #
    # IMPORTANT: Render fixes a service's region at creation and cannot move it.
    # This value only applies to a NEW service - use "Deploy in a new region" in
    # the dashboard, then repoint the web app at the new hostname.
    region: oregon
    rootDir: packages/backend
    # This service runs as a DOCKER service (a root Dockerfile is present), so
    # buildCommand and startCommand below are IGNORED by Render -- the image's
    # CMD is what starts the process. They are kept only as documentation of
    # intent; the Dockerfile's CMD runs "prisma migrate deploy" first so pending
    # migrations apply on deploy.
    #
    # Migrations used to be skipped entirely, because a comment here claimed
    # production had no _prisma_migrations table and that "migrate deploy" would
    # replay all fifteen and fail. That premise is false: the table exists with
    # all fifteen recorded as applied, and "prisma migrate status" against
    # production reports only what is genuinely pending.
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/server.js
    # Render's free compute plan cannot run more than one instance, so the API
    # stays a single instance here. That is not a performance problem on its own
    # - the cross-region database round trip was - and the free plan keeps cost
    # at zero. Scaling out needs a paid plan, and the Redis-backed shared state
    # in the backend is already in place for when that happens.
    #
    # Do not add a "plan:" key unless the service is being moved to a paid
    # compute plan; leaving it out is what keeps this service free.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      # Allowed web origins for the API. This is a *committed* value rather than
      # sync: false, which is what the custom-domain outage was: with sync:
      # false Render never applies anything from this file, so the only value
      # was whatever had been typed into the dashboard by hand. When the site
      # moved to yuvers.in the dashboard still held the old vercel.app URL, every
      # request from the real domain was rejected with 403, and the browser
      # reported it only as "Network Error" because the CORS failure strips the
      # response body.
      #
      # Syncing it means a new domain is a one-line change here plus a push,
      # instead of an outage that can only be fixed by someone with dashboard
      # access. The trade-off, accepted deliberately: adding an origin in the
      # dashboard will be reverted by the next deploy. Origins are not secrets,
      # so committing them is fine; anything sensitive in this file would not be.
      #
      # Both the apex and www are listed deliberately - they are separate
      # origins to a browser, so allowing one does not allow the other.
      - key: CORS_ORIGIN
        value: "https://yuvers.in,https://www.yuvers.in,https://2rent-01.vercel.app"
      # The canonical public web origin. Used for the post-payment return, so it
      # must be the origin a payer should land on. A loopback or missing value
      # makes live payment order creation refuse instead of redirecting someone
      # to localhost after they have paid.
      - key: PUBLIC_WEB_ORIGIN
        value: "https://yuvers.in"
      # The break-glass super admin. Its address also defaults in code
      # (DEFAULT_PRIMARY_SUPER_ADMIN_EMAIL) because the boot-time repair that
      # un-suspends the account needs it, and that repair silently did nothing
      # while this was unset. Declared so the deployed value and the code
      # default cannot disagree.
      - key: ADMIN_EMAIL
        value: "santhoshkrishna958@gmail.com"
      # Shared cache + cross-instance state. Set this in the dashboard.
      # sync: false keeps Render from overwriting a value you set by hand.
      #
      # CAUTION: a Render Key Value *internal* URL (redis://red-...:6379) only
      # resolves from services in the SAME region. The Key Value must be created
      # in Oregon to match this service, or REDIS_URL must point at an
      # externally reachable Redis (e.g. Upstash) instead.
      # The backend degrades to in-process state if this is missing, so a wrong
      # value costs performance, not uptime.
      - key: REDIS_URL
        sync: false
      # Firebase Admin service account, stored as the whole JSON minified to one
      # line. sync: false so a fresh Blueprint deploy cannot silently come up
      # with push half-configured: the backend treats a missing credential as
      # "notifications unavailable" rather than failing boot, which means the
      # omission would only be noticed by users not receiving notifications.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Cashfree credentials for the PG migration.
      #
      # sync: false for the same reason as REDIS_URL above: these are set by
      # hand in the dashboard, and a Blueprint sync would overwrite them. They
      # are declared anyway so a new service provisioned from this file knows
      # which variables it needs instead of booting without them.
      #
      # CASHFREE_SECRET_KEY is deliberately NOT a distinct webhook secret:
      # Cashfree signs inbound webhooks with this same PG secret key. When keys
      # are rotated, signature verification must use the OLDEST active key pair,
      # because that is the one Cashfree signs with.
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      # Which gateway handles live payments. Cashfree only.
      - key: PAYMENT_PROVIDER
        value: cashfree
      # Cashfree runs test and production on separate hosts with separate
      # credentials, and each rejects keys issued for the other. Keep this in
      # step with whichever keys are set above.
      - key: CASHFREE_API_ENV
        value: production
    # The liveness route is mounted at the root ("/health"), not under /api -
    # everything under /api sits behind auth middleware and answers 401 here,
    # which would fail every deploy's health check.
    healthCheckPath: /health
    autoDeploy: true
