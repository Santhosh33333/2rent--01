services:
  - type: web
    name: rentbuddy-api
    runtime: node
    # The database is Supabase in AWS ap-southeast-1 (Singapore). Running the
    # API in Oregon put every single query across the Pacific: a trivial
    # SELECT 1 measured ~875ms, which is ~4 round trips at ~220ms RTT.
    # Singapore puts the API next to the database (single-digit ms) and is also
    # much closer to the users, who are in India.
    #
    # IMPORTANT: Render fixes a service's region at creation and cannot move it.
    # This value only applies to a NEW service - use "Deploy in a new region" in
    # the dashboard, then repoint the web app at the new hostname.
    region: singapore
    rootDir: packages/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    # The liveness route is mounted at the root ("/health"), not under /api -
    # everything under /api sits behind auth middleware and answers 401 here,
    # which would fail every deploy's health check.
    healthCheckPath: /health
    autoDeploy: true
