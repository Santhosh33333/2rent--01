services:
  - type: web
    name: rentbuddy-api
    runtime: node
    region: oregon
    rootDir: packages/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
    # The liveness route is mounted at the root ("/health"), not under /api -
    # everything under /api sits behind auth middleware and answers 401 here,
    # which would fail every deploy's health check.
    healthCheckPath: /health
    autoDeploy: true
